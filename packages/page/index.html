<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Compare Torchlight: Infinite builds, see exactly what changed, and understand which damage and survival layers need attention."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tli-lens.ckreeses.chatgpt.site/" />
    <meta property="og:title" content="TLI Lens — See exactly where your damage went." />
    <meta
      property="og:description"
      content="Compare real TLI loadouts and separate proven formula evidence from unsupported mechanics."
    />
    <meta property="og:image" content="https://tli-lens.ckreeses.chatgpt.site/og.png" />
    <meta property="og:image:alt" content="TLI Lens build comparison interface" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TLI Lens — See exactly where your damage went." />
    <meta
      name="twitter:description"
      content="Compare real TLI loadouts, inspect guarded formula evidence, and learn what still blocks an exact answer."
    />
    <meta name="twitter:image" content="https://tli-lens.ckreeses.chatgpt.site/og.png" />
    <meta name="twitter:image:alt" content="TLI Lens build comparison interface" />
    <style>
      html { background: #090b0d; color-scheme: dark; }
    </style>
    <title>TLI Lens — Understand your build</title>
    <link rel="canonical" href="https://tli-lens.ckreeses.chatgpt.site/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>

    <dialog id="import-dialog" class="import-dialog" aria-labelledby="import-title">
      <form method="dialog" class="dialog-shell">
        <div class="dialog-head">
          <div>
            <span class="eyebrow">Local import</span>
            <h2 id="import-title">Bring in a build</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="Close import dialog">×</button>
        </div>
        <div class="import-tabs" role="tablist" aria-label="Import method">
          <button
            type="button"
            class="import-tab active"
            id="import-tab-file"
            data-import-tab="file"
            role="tab"
            aria-controls="import-panel-file"
            aria-selected="true"
            tabindex="0"
          >
            Build file
          </button>
          <button
            type="button"
            class="import-tab"
            id="import-tab-paste"
            data-import-tab="paste"
            role="tab"
            aria-controls="import-panel-paste"
            aria-selected="false"
            tabindex="-1"
          >
            Paste code or JSON
          </button>
        </div>
        <section
          class="import-panel"
          id="import-panel-file"
          data-import-panel="file"
          role="tabpanel"
          aria-labelledby="import-tab-file"
        >
          <label
            class="drop-zone"
            id="drop-zone"
            for="build-file"
            role="button"
            tabindex="0"
            aria-describedby="drop-help"
          >
            <span class="drop-icon" aria-hidden="true">↓</span>
            <strong>Drop a build JSON here</strong>
            <span id="drop-help">TLI Compendium exports and tli_dump portable snapshots up to 25 MiB are accepted.</span>
            <span class="file-button">Choose a file</span>
          </label>
          <input id="build-file" type="file" accept=".json,application/json" hidden />
        </section>
        <section
          class="import-panel"
          id="import-panel-paste"
          data-import-panel="paste"
          role="tabpanel"
          aria-labelledby="import-tab-paste"
          hidden
        >
          <label class="paste-label" for="build-paste">In-game build code or exported JSON · 25 MiB max</label>
          <textarea
            id="build-paste"
            rows="8"
            maxlength="26214400"
            spellcheck="false"
            placeholder="2L8xV4YBEfGpdQAAAAAACw=="
          ></textarea>
          <button type="button" class="primary-button full" id="analyze-paste">Inspect import</button>
        </section>
        <div id="import-status" class="import-status" role="status" aria-live="polite"></div>
        <p class="privacy-note">
          Your file stays in this browser. Nothing is uploaded.
        </p>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
