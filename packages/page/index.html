<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Compare Torchlight: Infinite builds, understand every DPS change, and find the next upgrade that actually helps."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TLI Lens — See exactly where your damage went." />
    <meta
      property="og:description"
      content="Compare real TLI loadouts, replay the damage formula, and separate proven changes from unsupported mechanics."
    />
    <meta property="og:image" content="https://tli-lens.ckreeses.chatgpt.site/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TLI Lens — See exactly where your damage went." />
    <meta
      name="twitter:description"
      content="Compare real TLI loadouts and understand why an upgrade raised or lowered your damage."
    />
    <meta name="twitter:image" content="https://tli-lens.ckreeses.chatgpt.site/og.png" />
    <style>
      html { background: #090b0d; color-scheme: dark; }
    </style>
    <title>TLI Lens — Understand your build</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>

    <dialog id="import-dialog" class="import-dialog" aria-labelledby="import-title">
      <form method="dialog" class="dialog-shell">
        <div class="dialog-head">
          <div>
            <span class="eyebrow">Local import</span>
            <h2 id="import-title">Bring in a build</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="Close import dialog">×</button>
        </div>
        <div class="import-tabs" role="tablist" aria-label="Import method">
          <button type="button" class="import-tab active" data-import-tab="file" role="tab" aria-selected="true">
            Build file
          </button>
          <button type="button" class="import-tab" data-import-tab="paste" role="tab" aria-selected="false">
            Paste code or JSON
          </button>
        </div>
        <section class="import-panel" data-import-panel="file">
          <label class="drop-zone" id="drop-zone" for="build-file">
            <span class="drop-icon" aria-hidden="true">↓</span>
            <strong>Drop a build JSON here</strong>
            <span>TLI Compendium exports and tli_dump portable snapshots are accepted.</span>
            <span class="file-button">Choose a file</span>
          </label>
          <input id="build-file" type="file" accept=".json,application/json" hidden />
        </section>
        <section class="import-panel" data-import-panel="paste" hidden>
          <label class="paste-label" for="build-paste">Build code, share URL, or exported JSON</label>
          <textarea
            id="build-paste"
            rows="8"
            spellcheck="false"
            placeholder="2L8xV4YBEfGpdQAAAAAACw=="
          ></textarea>
          <button type="button" class="primary-button full" id="analyze-paste">Inspect import</button>
        </section>
        <div id="import-status" class="import-status" role="status" aria-live="polite"></div>
        <p class="privacy-note">
          Your file stays in this browser. Nothing is uploaded.
        </p>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
